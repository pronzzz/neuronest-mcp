[project]
name = "neuronest"
version = "0.1.0"
description = "Your AI's private doorway into your Second Brain (MCP Server)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.6.0"
]

[project.scripts]
neuronest = "neuronest.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
